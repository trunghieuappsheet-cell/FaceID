 <!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIM FaceID</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <meta property="og:title" content="BIM FACEID">
    <meta property="og:description" content="Phần mềm đăng ký chấm công khuôn mặt">
    <meta property="og:image" content="https://faceid.hama.io.vn/logo.png">
    
    <title>BIM FaceID</title>
    <link rel="icon" type="image/png" href="favicon.png?v=3"/>  
  <style>
    :root {
      --bim-green: #0A7036; 
      --bim-green-dark: #054a22;
      --neutral-bg: #f4f6f8;
    }
    
    body {
      background-color: var(--neutral-bg);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333333;
      padding-top: 30px;
    }
    
    .main-card {
      border: none;
      border-top: 6px solid var(--bim-green); 
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      background: #ffffff;
    }
    
    .logo-box img { max-height: 45px; margin-bottom: 12px; }
    .main-title { color: var(--bim-green); font-weight: 800; font-size: 1.5rem; letter-spacing: 0.5px; }
    
    .btn-bim { background-color: var(--bim-green); color: white; border: none; font-weight: 600; transition: all 0.3s ease; }
    .btn-bim:hover { background-color: var(--bim-green-dark); color: white; }
    .btn-bim:disabled { background-color: #a3cca9; color: #ffffff; }
    
    .search-wrapper { position: relative; }
    
    .suggestion-container {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 1050;
      max-height: 240px; overflow-y: auto; box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      border-radius: 0 0 8px 8px; background: #ffffff; border: 1px solid #ced4da; border-top: none;
    }
    
    .suggestion-row { padding: 10px 15px; cursor: pointer; transition: background 0.2s ease; }
    .suggestion-row:hover { background-color: #f1f8f4; }
    .suggestion-row:not(:last-child) { border-bottom: 1px solid #f1f1f1; }
    
    #preview-container {
      position: relative; width: 130px; height: 170px; margin: 10px auto 20px auto;
      border: 2px dashed #ced4da; border-radius: 8px; overflow: hidden;
      background-color: #fafafa; display: flex; align-items: center; justify-content: center;
    }
    
    #preview-img { width: 100%; height: 100%; object-fit: cover; }
    .status-badge { font-size: 0.85rem; padding: 6px 14px; border-radius: 30px; font-weight: 500; }
    
    .loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.92); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <div id="loading" class="loading-overlay d-none">
    <div class="spinner-border text-success" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
    <h6 class="mt-3 text-secondary" id="loading-text">Đang kết nối dữ liệu...</h6>
  </div>

  <div class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card main-card p-4">
          
          <div class="text-center mb-4">
            <div class="logo-box">
              <img src="https://i.postimg.cc/LYY6ZpCQ/logobe.png" alt="BIM Group Logo">
            </div>
            <h2 class="main-title text-uppercase">Upload Chấm công khuôn mặt</h2>
          </div>
          
          <hr class="text-muted opacity-25 mb-4">
          
          <div class="mb-4 search-wrapper">
            <label class="form-label fw-bold text-secondary small text-uppercase"><i class="fa-solid fa-search me-2"></i>Tìm kiếm (Nhập MVN hoặc Họ tên)</label>
            <div class="input-group">
              <input type="text" id="userId" class="form-control form-control-lg bg-light" placeholder="Tìm ID hoặc tên nhân sự..." autocomplete="off" oninput="handleSearchInput(this.value)">
              <button class="btn btn-bim px-4" type="button" onclick="searchUser()"><i class="fa-solid fa-magnifying-glass"></i> Kiểm tra</button>
            </div>
            <div id="suggestion-box" class="suggestion-container d-none shadow-sm"></div>
            <div id="search-feedback" class="mt-2 text-center"></div>
          </div>
          
          <div class="row g-3 mb-4 p-3 rounded-3 bg-light border border-success border-opacity-25">
            <div class="col-6">
              <label class="small text-muted d-block mb-1">Họ và Tên</label>
              <span id="txt-name" class="fw-bold text-dark">-</span>
            </div>
            <div class="col-6">
              <label class="small text-muted d-block mb-1">Chức danh</label>
              <span id="txt-title" class="fw-bold text-dark">-</span>
            </div>
          </div>

          <div class="mb-4 text-center">
            <label class="form-label fw-bold text-secondary small text-uppercase d-block"><i class="fa-solid fa-camera me-2"></i>Ảnh chân dung hiện tại</label>
            <div id="photo-label-status" class="small text-muted mb-2"></div>
            
            <div id="preview-container" class="shadow-sm d-none">
              <img id="preview-img" alt="Thumbnail">
            </div>

            <input type="file" id="imageInput" accept="image/*" capture="environment" class="d-none" onchange="handleImageSelection(event)">
            
            <button type="button" id="btn-open-camera" class="btn btn-outline-success w-100 py-2 fw-bold" onclick="document.getElementById('imageInput').click()" disabled>
              <i class="fa-solid fa-camera me-2"></i>Mở Camera Chụp Trực Tiếp
            </button>
          </div>

          <button type="button" id="btn-submit" class="btn btn-bim w-100 btn-lg py-3 rounded-3 shadow-sm mt-3" onclick="submitAllData()" disabled>
            <i class="fa-solid fa-cloud-arrow-up me-2"></i>XÁC NHẬN
          </button>

        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // QUAN TRỌNG: Dán URL Web App của bạn vào đây
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0zv_Y0IByscmRGw3Z3Q52u-E1O-H45h7VBRs2IuepIQtveiFDAiumX6soyqFr1iIU/exec"; 
    
    let globalEmployeeList = []; 
    let base64ImageStr = null;
    let isUserVerified = false;

    window.addEventListener('DOMContentLoaded', () => {
      fetch(`${SCRIPT_URL}?action=getAllEmployees`)
        .then(response => response.json())
        .then(data => { globalEmployeeList = data; })
        .catch(err => console.error("Lỗi tải danh sách:", err));
    });

    function handleSearchInput(queryValue) {
      const inputStr = queryValue.trim().toLowerCase();
      const suggestionBox = document.getElementById('suggestion-box');
      
      if (!inputStr) {
        suggestionBox.classList.add('d-none');
        return;
      }

      const matches = globalEmployeeList.filter(emp => 
        emp.id.toLowerCase().includes(inputStr) || 
        emp.name.toLowerCase().includes(inputStr)
      ).slice(0, 6); 

      if (matches.length === 0) {
        suggestionBox.classList.add('d-none');
        return;
      }

      let innerHtml = '';
      matches.forEach(emp => {
        innerHtml += `
          <div class="suggestion-row text-start" onclick="clickSelectSuggestion('${emp.id}')">
            <strong class="text-success">${emp.id}</strong> — <span class="fw-semibold">${emp.name}</span> 
            <span class="text-muted d-block small" style="font-size:0.78rem;">Chức danh: ${emp.title}</span>
          </div>
        `;
      });

      suggestionBox.innerHTML = innerHtml;
      suggestionBox.classList.remove('d-none');
    }

    function clickSelectSuggestion(selectedId) {
      document.getElementById('userId').value = selectedId;
      document.getElementById('suggestion-box').classList.add('d-none');
      searchUser();
    }

    document.addEventListener('click', function(e) {
      const inputEl = document.getElementById('userId');
      const boxEl = document.getElementById('suggestion-box');
      if (!inputEl.contains(e.target) && !boxEl.contains(e.target)) {
        boxEl.classList.add('d-none');
      }
    });

    function searchUser() {
      const idInput = document.getElementById('userId').value.trim();
      if(!idInput) return alert("Vui lòng điền thông tin ID cần kiểm tra");

      showLoading("Đang kiểm tra thông tin...");
      document.getElementById('suggestion-box').classList.add('d-none');
      
      fetch(`${SCRIPT_URL}?action=getUserInfo&id=${encodeURIComponent(idInput)}`)
        .then(res => res.json())
        .then(response => {
          hideLoading();
          const feedback = document.getElementById('search-feedback');
          const lblStatus = document.getElementById('photo-label-status');
          const previewContainer = document.getElementById('preview-container');
          const previewImg = document.getElementById('preview-img');
          const btnCamera = document.getElementById('btn-open-camera');

          if(response.success) {
            document.getElementById('txt-name').innerText = response.name;
            document.getElementById('txt-title').innerText = response.title || 'Không có';
            isUserVerified = true;
            btnCamera.disabled = false;
            
            previewContainer.classList.add('d-none');
            previewImg.src = "";
            base64ImageStr = null; 

            if (response.hasImage) {
              feedback.innerHTML = '<span class="badge bg-warning text-dark status-badge"><i class="fa-solid fa-user-check me-1"></i>Nhân sự đã có hình ảnh</span>';
              btnCamera.innerHTML = '<i class="fa-solid fa-camera me-2"></i>Chụp ảnh thay thế / Cập nhật';
            } else {
              feedback.innerHTML = '<span class="badge bg-success status-badge"><i class="fa-solid fa-circle-check me-1"></i>Hợp lệ (Chưa có ảnh)</span>';
              btnCamera.innerHTML = '<i class="fa-solid fa-camera me-2"></i>Mở Camera Chụp Trực Tiếp';
            }
            validateForm();
          } else {
            document.getElementById('txt-name').innerText = "-";
            document.getElementById('txt-title').innerText = "-";
            feedback.innerHTML = `<span class="badge bg-danger status-badge"><i class="fa-solid fa-circle-xmark me-1"></i>${response.msg}</span>`;
            lblStatus.innerHTML = '';
            previewContainer.classList.add('d-none');
            btnCamera.innerHTML = '<i class="fa-solid fa-camera me-2"></i>Mở Camera Chụp Trực Tiếp';
            btnCamera.disabled = true;
            isUserVerified = false;
            base64ImageStr = null;
            validateForm();
          }
        })
        .catch(err => {
          hideLoading();
          alert("Lỗi kết nối máy chủ API.");
        });
    }

    function handleImageSelection(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        base64ImageStr = e.target.result;
        
        document.getElementById('preview-img').src = base64ImageStr;
        document.getElementById('preview-container').classList.remove('d-none');
        document.getElementById('preview-container').style.border = "2px solid var(--bim-green)";
        document.getElementById('photo-label-status').innerHTML = '<span class="text-success fw-bold">(Ảnh thẻ vừa chụp - Sẵn sàng gửi)</span>';
        document.getElementById('btn-open-camera').innerHTML = '<i class="fa-solid fa-rotate-right me-2"></i>Chụp lại ảnh khác';
        
        validateForm();
      };
      reader.readAsDataURL(file);
    }

    function validateForm() {
      const btnSubmit = document.getElementById('btn-submit');
      btnSubmit.disabled = !(isUserVerified && base64ImageStr);
    }

    function submitAllData() {
      if (!isUserVerified || !base64ImageStr) return;
      
      showLoading("Đang tải hình ảnh lên Google Drive và ghi vào Sheet...");
      
      const payload = {
        id: document.getElementById('userId').value.trim(),
        image: base64ImageStr
      };

      // Gửi POST request dạng text/plain để vượt qua CORS preflight của Google Apps Script
      fetch(SCRIPT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        hideLoading();
        if(res.success) {
          alert(res.msg);
          resetForm();
        } else {
          alert("Thất bại: " + res.msg);
        }
      })
      .catch(err => {
        hideLoading();
        alert("Lỗi đường truyền hoặc máy chủ.");
      });
    }

    function resetForm() {
      document.getElementById('userId').value = "";
      document.getElementById('txt-name').innerText = "-";
      document.getElementById('txt-title').innerText = "-";
      document.getElementById('search-feedback').innerHTML = "";
      document.getElementById('photo-label-status').innerHTML = "";
      
      base64ImageStr = null;
      isUserVerified = false;
      
      document.getElementById('preview-container').classList.add('d-none');
      document.getElementById('preview-img').src = "";
      document.getElementById('imageInput').value = "";
      document.getElementById('btn-open-camera').innerHTML = '<i class="fa-solid fa-camera me-2"></i>Mở Camera Chụp Trực Tiếp';
      document.getElementById('btn-open-camera').disabled = true;
      
      validateForm();
    }

    function showLoading(text) {
      document.getElementById('loading-text').innerText = text;
      document.getElementById('loading').classList.remove('d-none');
    }

    function hideLoading() {
      document.getElementById('loading').classList.add('d-none');
    }
  </script>
</body>
</html>
