<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIM Group - Upload khuôn mặt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    :root { --bim-green: #0A7036; --bim-green-dark: #054a22; --neutral-bg: #f4f6f8; }
    body { background-color: var(--neutral-bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333333; padding-top: 30px; }
    .main-card { border: none; border-top: 6px solid var(--bim-green); border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); background: #ffffff; }
    .logo-box img { max-height: 45px; margin-bottom: 12px; }
    .main-title { color: var(--bim-green); font-weight: 800; font-size: 1.5rem; letter-spacing: 0.5px; }
    .btn-bim { background-color: var(--bim-green); color: white; border: none; font-weight: 600; transition: all 0.3s ease; }
    .btn-bim:hover { background-color: var(--bim-green-dark); color: white; }
    .btn-bim:disabled { background-color: #a3cca9; color: #ffffff; }
    
    .search-wrapper { position: relative; }
    .suggestion-container { position: absolute; top: 100%; left: 0; right: 0; z-index: 1050; max-height: 250px; overflow-y: auto; box-shadow: 0 8px 16px rgba(0,0,0,0.15); border-radius: 0 0 8px 8px; background: #ffffff; border: 1px solid #ced4da; border-top: none; }
    .suggestion-row { padding: 12px 15px; cursor: pointer; transition: background 0.2s ease; display: flex; justify-content: space-between; align-items: center;}
    .suggestion-row:hover { background-color: #f1f8f4; }
    .suggestion-row:not(:last-child) { border-bottom: 1px solid #f1f1f1; }
    
    .status-badge { font-size: 0.85rem; padding: 6px 14px; border-radius: 30px; font-weight: 500; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.92); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    #camera-section { display: none; margin-top: 15px; text-align: center; position: relative; max-width: 100%; margin-left: auto; margin-right: auto;}
    #video-stream { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .video-mirror { transform: scaleX(-1); }
    
    .btn-switch-cam { position: absolute; top: 10px; right: 10px; z-index: 10; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: all 0.3s; }
    .btn-switch-cam:hover { background: rgba(0,0,0,0.8); transform: scale(1.1); }
    
    #preview-container { width: 100%; text-align: center; display: none; }
    #preview-img { max-width: 100%; max-height: 400px; border-radius: 8px; border: 3px solid var(--bim-green); object-fit: contain; }
    #canvas-capture { display: none; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
  </style>
</head>
<body>

  <div id="loading" class="loading-overlay">
    <div class="spinner-border text-success" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
    <h6 class="mt-3 text-secondary" id="loading-text">Đang tải dữ liệu nhân sự...</h6>
  </div>

  <div class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card main-card p-4">
          
          <div class="text-center mb-4">
            <div class="logo-box"><img src="https://i.postimg.cc/LYY6ZpCQ/logobe.png" alt="BIM Group Logo"></div>
            <h2 class="main-title text-uppercase">Upload Chấm công khuôn mặt</h2>
          </div>
          
          <!-- Nút Chuyển Chế Độ -->
          <div class="text-end mb-3">
            <button class="btn btn-sm btn-outline-primary fw-bold" onclick="toggleMode()" id="btn-toggle-mode">
              <i class="fa-solid fa-user-plus me-1"></i>Thêm nhân sự mới
            </button>
          </div>

          <hr class="text-muted opacity-25 mb-4">
          
          <!-- ================= CHẾ ĐỘ 1: TÌM KIẾM ================= -->
          <div id="mode-search-section">
            <div class="mb-3 search-wrapper">
              <label class="form-label fw-bold text-secondary small text-uppercase"><i class="fa-solid fa-search me-2"></i>Tìm kiếm (Nhập MVN hoặc Họ tên)</label>
              <div class="input-group">
                <input type="text" id="userId" class="form-control form-control-lg bg-light" placeholder="Nhập mã hoặc tên không dấu..." autocomplete="off" oninput="handleSearchInput(this.value)">
              </div>
              <div id="suggestion-box" class="suggestion-container d-none shadow-sm"></div>
              <div id="search-feedback" class="mt-2 text-center"></div>
            </div>

            <div class="mb-4" id="missing-list-wrapper">
              <button class="btn btn-sm btn-outline-secondary w-100 mb-2" type="button" onclick="toggleMissingList()">
                <i class="fa-solid fa-users-viewfinder me-2"></i>Hiển thị danh sách chưa có ảnh <span id="missing-count" class="badge bg-danger ms-1">0</span>
              </button>
              <div id="missing-list-container" class="d-none border rounded-3 p-2 bg-light shadow-sm" style="max-height: 200px; overflow-y: auto;">
              </div>
            </div>
            
            <div class="row g-3 mb-4 p-3 rounded-3 bg-light border border-success border-opacity-25" id="info-section">
              <div class="col-6">
                <label class="small text-muted d-block mb-1">Họ và Tên</label>
                <span id="txt-name" class="fw-bold text-dark">-</span>
              </div>
              <div class="col-6">
                <label class="small text-muted d-block mb-1">Chức danh</label>
                <span id="txt-title" class="fw-bold text-dark">-</span>
              </div>
            </div>
          </div>

          <!-- ================= CHẾ ĐỘ 2: THÊM MỚI ================= -->
          <div id="mode-add-section" class="d-none mb-4 p-3 rounded-3 bg-light border border-primary border-opacity-25">
            <h6 class="text-primary mb-3 fw-bold"><i class="fa-solid fa-user-plus me-2"></i>Khai báo nhân sự mới</h6>
            <div class="mb-3">
              <label class="form-label fw-bold text-secondary small">Mã nhân viên (MNV) <span class="text-danger">*</span></label>
              <input type="text" id="new-userId" class="form-control" placeholder="VD: BIM12345" oninput="validateNewUser()">
            </div>
            <div class="mb-2">
              <label class="form-label fw-bold text-secondary small">Họ và tên <span class="text-danger">*</span></label>
              <input type="text" id="new-userName" class="form-control" placeholder="VD: Nguyễn Văn A" oninput="validateNewUser()">
            </div>
          </div>


          <!-- ================= KHU VỰC CAMERA ================= -->
          <div class="mb-4 text-center">
            <label class="form-label fw-bold text-secondary small text-uppercase d-block"><i class="fa-solid fa-camera me-2"></i>Chụp ảnh chân dung trực tiếp</label>
            <div id="photo-label-status" class="small text-muted mb-2"></div>
            
            <button type="button" id="btn-open-camera" class="btn btn-outline-success w-100 py-2 fw-bold" onclick="startCamera()" disabled>
              <i class="fa-solid fa-video me-2"></i>Bật Camera Chụp Ảnh
            </button>

            <!-- Video Live Camera -->
            <div id="camera-section">
              <button type="button" class="btn-switch-cam" onclick="switchCamera()" title="Đổi Camera Trước/Sau">
                <i class="fa-solid fa-camera-rotate fs-5"></i>
              </button>
              <video id="video-stream" class="video-mirror" autoplay playsinline></video>
              <button type="button" class="btn btn-danger w-100 mt-2 py-2 fw-bold" onclick="captureImage()">
                <i class="fa-solid fa-circle-dot me-2"></i>CHỤP ẢNH NGAY
              </button>
            </div>
            
            <canvas id="canvas-capture"></canvas>
            <div id="preview-container" class="mt-3">
              <img id="preview-img" alt="Thumbnail">
              <button type="button" class="btn btn-outline-secondary w-100 mt-2" onclick="retakePhoto()">
                <i class="fa-solid fa-rotate-right me-2"></i>Chụp Lại
              </button>
            </div>
          </div>

          <button type="button" id="btn-submit" class="btn btn-bim w-100 btn-lg py-3 rounded-3 shadow-sm mt-3" onclick="submitAllData()" disabled>
            <i class="fa-solid fa-cloud-arrow-up me-2"></i>TẢI ẢNH LÊN HỆ THỐNG
          </button>

        </div>
      </div>
    </div>
  </div>

  <script>
    // THAY LINK SCRIPT CỦA BẠN VÀO ĐÂY (Nhớ copy link Deploy bản mới nhất)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0zv_Y0IByscmRGw3Z3Q52u-E1O-H45h7VBRs2IuepIQtveiFDAiumX6soyqFr1iIU/exec"; 
    
    let globalEmployeeList = []; 
    let base64ImageStr = null;
    let isUserVerified = false;
    let isAddNewMode = false; // Cờ kiểm tra chế độ
    
    let cameraStream = null;
    let currentFacingMode = "user"; 

    function removeVietnameseTones(str) {
      str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g,"a");
      str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g,"e");
      str = str.replace(/ì|í|ị|ỉ|ĩ/g,"i");
      str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g,"o");
      str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g,"u");
      str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g,"y");
      str = str.replace(/đ/g,"d");
      str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
      str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
      str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
      str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
      str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
      str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
      str = str.replace(/Đ/g, "D");
      return str;
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetch(`${SCRIPT_URL}?action=getAllEmployees`)
        .then(res => res.json())
        .then(data => { 
          globalEmployeeList = data; 
          updateMissingCount();
          hideLoading(); 
        })
        .catch(err => {
          document.getElementById('loading-text').innerText = "Lỗi kết nối máy chủ!";
        });
    });

    // ==========================================
    // CHUYỂN ĐỔI CHẾ ĐỘ: TÌM KIẾM <-> THÊM MỚI
    // ==========================================
    function toggleMode() {
      isAddNewMode = !isAddNewMode;
      const btnToggle = document.getElementById('btn-toggle-mode');
      const sectionSearch = document.getElementById('mode-search-section');
      const sectionAdd = document.getElementById('mode-add-section');

      resetForm(); // Reset sạch form khi đổi chế độ

      if (isAddNewMode) {
        btnToggle.innerHTML = '<i class="fa-solid fa-magnifying-glass me-1"></i>Quay lại Tìm kiếm';
        btnToggle.classList.replace('btn-outline-primary', 'btn-outline-secondary');
        
        sectionSearch.classList.add('d-none');
        sectionAdd.classList.remove('d-none');
      } else {
        btnToggle.innerHTML = '<i class="fa-solid fa-user-plus me-1"></i>Thêm nhân sự mới';
        btnToggle.classList.replace('btn-outline-secondary', 'btn-outline-primary');
        
        sectionSearch.classList.remove('d-none');
        sectionAdd.classList.add('d-none');
      }
    }

    // Validate cho Form Thêm Mới
    function validateNewUser() {
      if (!isAddNewMode) return;
      const newId = document.getElementById('new-userId').value.trim();
      const newName = document.getElementById('new-userName').value.trim();

      if (newId !== "" && newName !== "") {
        isUserVerified = true;
        document.getElementById('btn-open-camera').disabled = false;
      } else {
        isUserVerified = false;
        document.getElementById('btn-open-camera').disabled = true;
        stopCamera();
        document.getElementById('camera-section').style.display = "none";
      }
      validateForm();
    }


    function updateMissingCount() {
      const missingCount = globalEmployeeList.filter(u => !u.hasImage).length;
      document.getElementById('missing-count').innerText = missingCount;
      renderMissingList();
    }

    function toggleMissingList() {
      const container = document.getElementById('missing-list-container');
      container.classList.toggle('d-none');
    }

    function renderMissingList() {
      const container = document.getElementById('missing-list-container');
      const missing = globalEmployeeList.filter(u => !u.hasImage);
      
      if(missing.length === 0) {
        container.innerHTML = `<div class="text-center text-success small py-2"><i class="fa-solid fa-check-circle me-1"></i>Tuyệt vời! Toàn bộ NV đã có ảnh.</div>`;
        return;
      }
      let html = `<div class="list-group list-group-flush">`;
      missing.forEach(emp => {
        html += `
          <button type="button" class="list-group-item list-group-item-action py-2 px-1 d-flex justify-content-between align-items-center" onclick="selectUser('${emp.id}')">
            <div>
              <strong class="text-success">${emp.id}</strong> - ${emp.name}
              <div class="small text-muted" style="font-size:0.75rem;">${emp.title}</div>
            </div>
            <i class="fa-solid fa-chevron-right text-muted small"></i>
          </button>`;
      });
      html += `</div>`;
      container.innerHTML = html;
    }

    function handleSearchInput(queryValue) {
      const inputStr = removeVietnameseTones(queryValue.trim().toLowerCase());
      const suggestionBox = document.getElementById('suggestion-box');
      
      if (!inputStr) {
        suggestionBox.classList.add('d-none');
        return;
      }
      const matches = globalEmployeeList.filter(emp => 
        removeVietnameseTones(emp.id.toLowerCase()).includes(inputStr) || 
        removeVietnameseTones(emp.name.toLowerCase()).includes(inputStr)
      ).slice(0, 6); 

      if (matches.length === 0) {
        suggestionBox.classList.add('d-none');
        return;
      }
      let innerHtml = '';
      matches.forEach(emp => {
        let iconHtml = emp.hasImage ? `<span class="badge bg-success bg-opacity-10 text-success border border-success rounded-pill px-2 py-1" style="font-size:0.7rem;"><i class="fa-solid fa-check me-1"></i>Đã có ảnh</span>` : `<span class="badge bg-danger bg-opacity-10 text-danger border border-danger rounded-pill px-2 py-1" style="font-size:0.7rem;">Chưa có</span>`;
        innerHtml += `
          <div class="suggestion-row" onclick="selectUser('${emp.id}')">
            <div>
              <strong class="text-success">${emp.id}</strong> — <span class="fw-semibold">${emp.name}</span> 
              <span class="text-muted d-block small" style="font-size:0.78rem;">Chức danh: ${emp.title}</span>
            </div>
            <div>${iconHtml}</div>
          </div>`;
      });
      suggestionBox.innerHTML = innerHtml;
      suggestionBox.classList.remove('d-none');
    }

    function selectUser(selectedId) {
      document.getElementById('suggestion-box').classList.add('d-none');
      document.getElementById('missing-list-container').classList.add('d-none');
      
      const user = globalEmployeeList.find(u => u.id === selectedId);
      if(!user) return;
      
      document.getElementById('userId').value = user.id;
      document.getElementById('txt-name').innerText = user.name;
      document.getElementById('txt-title').innerText = user.title || 'Không có';
      isUserVerified = true;
      document.getElementById('btn-open-camera').disabled = false;
      
      const feedback = document.getElementById('search-feedback');
      if (user.hasImage) {
        feedback.innerHTML = '<span class="badge bg-warning text-dark status-badge"><i class="fa-solid fa-user-check me-1"></i>Hệ thống đã có ảnh thẻ</span>';
      } else {
        feedback.innerHTML = '<span class="badge bg-success status-badge"><i class="fa-solid fa-circle-check me-1"></i>Hợp lệ (Chưa có ảnh)</span>';
      }
      
      stopCamera();
      document.getElementById('preview-container').style.display = "none";
      base64ImageStr = null;
      validateForm();
    }

    document.addEventListener('click', function(e) {
      const inputEl = document.getElementById('userId');
      const boxEl = document.getElementById('suggestion-box');
      if (!inputEl.contains(e.target) && !boxEl.contains(e.target)) boxEl.classList.add('d-none');
    });

    // ==========================================
    // LOGIC CAMERA TRỰC TIẾP (YÊU CẦU ĐỘ PHÂN GIẢI CAO)
    // ==========================================
    const videoElement = document.getElementById('video-stream');
    const canvasElement = document.getElementById('canvas-capture');
    
    function startCamera() {
      document.getElementById('btn-open-camera').style.display = "none";
      document.getElementById('camera-section').style.display = "block";
      document.getElementById('preview-container').style.display = "none";
      base64ImageStr = null;
      validateForm();
      startStream();
    }

    function startStream() {
      stopCamera();
      
      // BẮT BUỘC ĐỘ PHÂN GIẢI GỐC CAO NHẤT THIẾT BỊ HỖ TRỢ
      const constraints = {
        video: {
          facingMode: currentFacingMode,
          width: { ideal: 4096 }, // Ép phần cứng đưa ra mức phân giải lớn nhất (sẽ tự tụt xuống 1080p nếu máy ko hỗ trợ 4k)
          height: { ideal: 2160 } 
        }
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => {
          cameraStream = stream;
          videoElement.srcObject = stream;
          
          if (currentFacingMode === "user") {
            videoElement.classList.add('video-mirror');
          } else {
            videoElement.classList.remove('video-mirror');
          }
        })
        .catch(err => {
          alert("Lỗi: Không thể truy cập Camera hoặc phần cứng không hỗ trợ. Vui lòng kiểm tra quyền trình duyệt!");
          document.getElementById('btn-open-camera').style.display = "block";
          document.getElementById('camera-section').style.display = "none";
        });
    }

    function switchCamera() {
      currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
      startStream();
    }

    function captureImage() {
      if(!cameraStream) return;
      
      // Sử dụng đúng kích thước phân giải thực của Video stream (độ phân giải cao)
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      const ctx = canvasElement.getContext('2d');
      
      if (currentFacingMode === "user") {
        ctx.translate(canvasElement.width, 0);
        ctx.scale(-1, 1);
      }
      
      ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
      
      // LƯU ẢNH CHẤT LƯỢNG CAO NHẤT (1.0 = Không giảm chất lượng)
      base64ImageStr = canvasElement.toDataURL('image/jpeg', 1.0); 
      
      document.getElementById('preview-img').src = base64ImageStr;
      document.getElementById('camera-section').style.display = "none";
      document.getElementById('preview-container').style.display = "block";
      
      stopCamera();
      validateForm();
    }

    function retakePhoto() {
      startCamera();
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }

    // ==========================================
    // LOGIC SUBMIT & RESET
    // ==========================================
    function validateForm() {
      const btnSubmit = document.getElementById('btn-submit');
      btnSubmit.disabled = !(isUserVerified && base64ImageStr);
    }

    function submitAllData() {
      if (!isUserVerified || !base64ImageStr) return;
      showLoading("Đang tải hình ảnh lên Google Drive và ghi vào Sheet...");
      
      // Lấy dữ liệu tùy theo chế độ đang chọn
      const payload = {
        id: isAddNewMode ? document.getElementById('new-userId').value.trim() : document.getElementById('userId').value.trim(),
        name: isAddNewMode ? document.getElementById('new-userName').value.trim() : "",
        isNew: isAddNewMode, // Đánh dấu là Thêm mới
        image: base64ImageStr
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        hideLoading();
        if(res.success) {
          alert(res.msg);
          
          if (!isAddNewMode) {
            const userIndex = globalEmployeeList.findIndex(u => u.id === payload.id);
            if(userIndex > -1) globalEmployeeList[userIndex].hasImage = true;
            updateMissingCount();
          } else {
            // Nếu thêm mới thành công, push tạm vào biến bộ nhớ local
            globalEmployeeList.push({ id: payload.id, name: payload.name, title: "", hasImage: true });
          }
          resetForm();
        } else alert("Thất bại: " + res.msg);
      })
      .catch(err => {
        hideLoading();
        alert("Lỗi đường truyền hoặc máy chủ.");
      });
    }

    function resetForm() {
      // Clear Form Tìm Kiếm
      document.getElementById('userId').value = "";
      document.getElementById('txt-name').innerText = "-";
      document.getElementById('txt-title').innerText = "-";
      document.getElementById('search-feedback').innerHTML = "";
      
      // Clear Form Thêm Mới
      document.getElementById('new-userId').value = "";
      document.getElementById('new-userName').value = "";
      
      base64ImageStr = null;
      isUserVerified = false;
      stopCamera();
      
      document.getElementById('camera-section').style.display = "none";
      document.getElementById('preview-container').style.display = "none";
      document.getElementById('btn-open-camera').style.display = "block";
      document.getElementById('btn-open-camera').disabled = true;
      
      validateForm();
    }

    function showLoading(text) {
      document.getElementById('loading-text').innerText = text;
      document.getElementById('loading').classList.remove('d-none');
    }

    function hideLoading() { document.getElementById('loading').classList.add('d-none'); }
  </script>
</body>
</html>
