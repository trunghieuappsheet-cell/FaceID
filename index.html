<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIM Group - Upload khuôn mặt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    :root { --bim-green: #0A7036; --bim-green-dark: #054a22; --neutral-bg: #f4f6f8; }
    body { background-color: var(--neutral-bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333333; padding-top: 30px; }
    .main-card { border: none; border-top: 6px solid var(--bim-green); border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); background: #ffffff; }
    .logo-box img { max-height: 45px; margin-bottom: 12px; }
    .main-title { color: var(--bim-green); font-weight: 800; font-size: 1.5rem; letter-spacing: 0.5px; }
    .btn-bim { background-color: var(--bim-green); color: white; border: none; font-weight: 600; transition: all 0.3s ease; }
    .btn-bim:hover { background-color: var(--bim-green-dark); color: white; }
    .btn-bim:disabled { background-color: #a3cca9; color: #ffffff; }
    
    .search-wrapper { position: relative; }
    .suggestion-container { position: absolute; top: 100%; left: 0; right: 0; z-index: 1050; max-height: 250px; overflow-y: auto; box-shadow: 0 8px 16px rgba(0,0,0,0.15); border-radius: 0 0 8px 8px; background: #ffffff; border: 1px solid #ced4da; border-top: none; }
    .suggestion-row { padding: 12px 15px; cursor: pointer; transition: background 0.2s ease; display: flex; justify-content: space-between; align-items: center;}
    .suggestion-row:hover { background-color: #f1f8f4; }
    .suggestion-row:not(:last-child) { border-bottom: 1px solid #f1f1f1; }
    
    .status-badge { font-size: 0.85rem; padding: 6px 14px; border-radius: 30px; font-weight: 500; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.92); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* Khu vực Camera Live */
    #camera-section { display: none; margin-top: 15px; text-align: center; }
    #video-stream { width: 100%; max-width: 320px; border-radius: 8px; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transform: scaleX(-1); /* Lật hình như soi gương */ }
    #preview-container { width: 100%; max-width: 320px; margin: 0 auto; display: none; }
    #preview-img { width: 100%; border-radius: 8px; border: 3px solid var(--bim-green); transform: scaleX(-1); }
    #canvas-capture { display: none; }
  </style>
</head>
<body>

  <div id="loading" class="loading-overlay">
    <div class="spinner-border text-success" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
    <h6 class="mt-3 text-secondary" id="loading-text">Đang tải dữ liệu nhân sự...</h6>
  </div>

  <div class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card main-card p-4">
          
          <div class="text-center mb-4">
            <div class="logo-box"><img src="https://i.postimg.cc/LYY6ZpCQ/logobe.png" alt="BIM Group Logo"></div>
            <h2 class="main-title text-uppercase">Upload Chấm công khuôn mặt</h2>
          </div>
          
          <hr class="text-muted opacity-25 mb-4">
          
          <!-- TÌM KIẾM -->
          <div class="mb-4 search-wrapper">
            <label class="form-label fw-bold text-secondary small text-uppercase"><i class="fa-solid fa-search me-2"></i>Tìm kiếm (Nhập MVN hoặc Họ tên)</label>
            <div class="input-group">
              <input type="text" id="userId" class="form-control form-control-lg bg-light" placeholder="Nhập mã hoặc tên không dấu..." autocomplete="off" oninput="handleSearchInput(this.value)">
            </div>
            <div id="suggestion-box" class="suggestion-container d-none shadow-sm"></div>
            <div id="search-feedback" class="mt-2 text-center"></div>
          </div>
          
          <!-- THÔNG TIN -->
          <div class="row g-3 mb-4 p-3 rounded-3 bg-light border border-success border-opacity-25">
            <div class="col-6">
              <label class="small text-muted d-block mb-1">Họ và Tên</label>
              <span id="txt-name" class="fw-bold text-dark">-</span>
            </div>
            <div class="col-6">
              <label class="small text-muted d-block mb-1">Chức danh</label>
              <span id="txt-title" class="fw-bold text-dark">-</span>
            </div>
          </div>

          <!-- KHU VỰC CAMERA TRỰC TIẾP -->
          <div class="mb-4 text-center">
            <label class="form-label fw-bold text-secondary small text-uppercase d-block"><i class="fa-solid fa-camera me-2"></i>Chụp ảnh chân dung trực tiếp</label>
            <div id="photo-label-status" class="small text-muted mb-2"></div>
            
            <button type="button" id="btn-open-camera" class="btn btn-outline-success w-100 py-2 fw-bold" onclick="startCamera()" disabled>
              <i class="fa-solid fa-video me-2"></i>Bật Camera Chụp Ảnh
            </button>

            <!-- Video Live Camera -->
            <div id="camera-section">
              <video id="video-stream" autoplay playsinline></video>
              <button type="button" class="btn btn-danger w-100 mt-2 py-2 fw-bold" onclick="captureImage()">
                <i class="fa-solid fa-circle-dot me-2"></i>CHỤP ẢNH NGAY
              </button>
            </div>
            
            <!-- Canvas Ẩn & Ảnh Preview -->
            <canvas id="canvas-capture"></canvas>
            <div id="preview-container" class="mt-3">
              <img id="preview-img" alt="Thumbnail">
              <button type="button" class="btn btn-outline-secondary w-100 mt-2" onclick="retakePhoto()">
                <i class="fa-solid fa-rotate-right me-2"></i>Chụp Lại
              </button>
            </div>
          </div>

          <button type="button" id="btn-submit" class="btn btn-bim w-100 btn-lg py-3 rounded-3 shadow-sm mt-3" onclick="submitAllData()" disabled>
            <i class="fa-solid fa-cloud-arrow-up me-2"></i>TẢI ẢNH LÊN HỆ THỐNG
          </button>

        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // DÁN URL WEB APP CỦA BẠN VÀO ĐÂY (Đuôi /exec)
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0zv_Y0IByscmRGw3Z3Q52u-E1O-H45h7VBRs2IuepIQtveiFDAiumX6soyqFr1iIU/exec"; 
    
    let globalEmployeeList = []; 
    let base64ImageStr = null;
    let isUserVerified = false;
    let cameraStream = null;

    // HÀM: Chuyển đổi Tiếng Việt có dấu thành không dấu
    function removeVietnameseTones(str) {
      str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g,"a");
      str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g,"e");
      str = str.replace(/ì|í|ị|ỉ|ĩ/g,"i");
      str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g,"o");
      str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g,"u");
      str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g,"y");
      str = str.replace(/đ/g,"d");
      str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
      str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
      str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
      str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
      str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
      str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
      str = str.replace(/Đ/g, "D");
      return str;
    }

    // Khởi động lấy dữ liệu 1 lần duy nhất
    window.addEventListener('DOMContentLoaded', () => {
      fetch(`${SCRIPT_URL}?action=getAllEmployees`)
        .then(res => res.json())
        .then(data => { 
          globalEmployeeList = data; 
          hideLoading(); 
        })
        .catch(err => {
          document.getElementById('loading-text').innerText = "Lỗi kết nối máy chủ!";
        });
    });

    // Lắng nghe nhập liệu tìm kiếm (Không dấu)
    function handleSearchInput(queryValue) {
      const inputStr = removeVietnameseTones(queryValue.trim().toLowerCase());
      const suggestionBox = document.getElementById('suggestion-box');
      
      if (!inputStr) {
        suggestionBox.classList.add('d-none');
        return;
      }

      const matches = globalEmployeeList.filter(emp => 
        removeVietnameseTones(emp.id.toLowerCase()).includes(inputStr) || 
        removeVietnameseTones(emp.name.toLowerCase()).includes(inputStr)
      ).slice(0, 6); 

      if (matches.length === 0) {
        suggestionBox.classList.add('d-none');
        return;
      }

      let innerHtml = '';
      matches.forEach(emp => {
        // Nếu hasImage = true, render icon tick xanh
        let iconHtml = emp.hasImage ? `<span class="badge bg-success bg-opacity-10 text-success border border-success rounded-pill px-2 py-1" style="font-size:0.7rem;"><i class="fa-solid fa-check me-1"></i>Đã có ảnh</span>` : '';
        
        innerHtml += `
          <div class="suggestion-row" onclick="selectUser('${emp.id}')">
            <div>
              <strong class="text-success">${emp.id}</strong> — <span class="fw-semibold">${emp.name}</span> 
              <span class="text-muted d-block small" style="font-size:0.78rem;">Chức danh: ${emp.title}</span>
            </div>
            <div>${iconHtml}</div>
          </div>
        `;
      });

      suggestionBox.innerHTML = innerHtml;
      suggestionBox.classList.remove('d-none');
    }

    // Khi chọn nhân viên: Xử lý TỨC THÌ (Tốc độ 0s) không cần gọi API
    function selectUser(selectedId) {
      document.getElementById('suggestion-box').classList.add('d-none');
      
      // Tìm data nhân viên trong Array đã tải
      const user = globalEmployeeList.find(u => u.id === selectedId);
      if(!user) return;
      
      document.getElementById('userId').value = user.id;
      document.getElementById('txt-name').innerText = user.name;
      document.getElementById('txt-title').innerText = user.title || 'Không có';
      isUserVerified = true;
      document.getElementById('btn-open-camera').disabled = false;
      
      const feedback = document.getElementById('search-feedback');
      if (user.hasImage) {
        feedback.innerHTML = '<span class="badge bg-warning text-dark status-badge"><i class="fa-solid fa-user-check me-1"></i>Hệ thống đã có ảnh thẻ</span>';
      } else {
        feedback.innerHTML = '<span class="badge bg-success status-badge"><i class="fa-solid fa-circle-check me-1"></i>Hợp lệ (Chưa có ảnh)</span>';
      }
      
      // Reset Camera UI
      stopCamera();
      document.getElementById('preview-container').style.display = "none";
      base64ImageStr = null;
      validateForm();
    }

    document.addEventListener('click', function(e) {
      const inputEl = document.getElementById('userId');
      const boxEl = document.getElementById('suggestion-box');
      if (!inputEl.contains(e.target) && !boxEl.contains(e.target)) boxEl.classList.add('d-none');
    });

    // ==========================================
    // LOGIC CAMERA TRỰC TIẾP (WebRTC - Không nộp file)
    // ==========================================
    const videoElement = document.getElementById('video-stream');
    const canvasElement = document.getElementById('canvas-capture');
    
    function startCamera() {
      document.getElementById('btn-open-camera').style.display = "none";
      document.getElementById('camera-section').style.display = "block";
      document.getElementById('preview-container').style.display = "none";
      base64ImageStr = null;
      validateForm();
      
      // Yêu cầu quyền mở Camera trước (soi gương)
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
          cameraStream = stream;
          videoElement.srcObject = stream;
        })
        .catch(err => {
          alert("Lỗi: Vui lòng cấp quyền truy cập Camera cho trình duyệt!");
          document.getElementById('btn-open-camera').style.display = "block";
          document.getElementById('camera-section').style.display = "none";
        });
    }

    function captureImage() {
      if(!cameraStream) return;
      
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      const ctx = canvasElement.getContext('2d');
      // Lật lại ảnh vẽ ra canvas (vì cam trước bị ngược)
      ctx.translate(canvasElement.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
      
      base64ImageStr = canvasElement.toDataURL('image/jpeg', 0.85); // Nén ảnh JPG 85%
      
      document.getElementById('preview-img').src = base64ImageStr;
      document.getElementById('camera-section').style.display = "none";
      document.getElementById('preview-container').style.display = "block";
      
      stopCamera();
      validateForm();
    }

    function retakePhoto() {
      startCamera();
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }

    // ==========================================
    // LOGIC SUBMIT
    // ==========================================
    function validateForm() {
      const btnSubmit = document.getElementById('btn-submit');
      btnSubmit.disabled = !(isUserVerified && base64ImageStr);
    }

    function submitAllData() {
      if (!isUserVerified || !base64ImageStr) return;
      
      showLoading("Đang tải hình ảnh lên Google Drive và ghi vào Sheet...");
      
      const payload = {
        id: document.getElementById('userId').value.trim(),
        image: base64ImageStr
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        hideLoading();
        if(res.success) {
          alert(res.msg);
          // Đánh dấu người này đã có ảnh trực tiếp ở Client, không cần load lại từ đầu
          const userIndex = globalEmployeeList.findIndex(u => u.id === payload.id);
          if(userIndex > -1) globalEmployeeList[userIndex].hasImage = true;
          
          resetForm();
        } else alert("Thất bại: " + res.msg);
      })
      .catch(err => {
        hideLoading();
        alert("Lỗi đường truyền hoặc máy chủ.");
      });
    }

    function resetForm() {
      document.getElementById('userId').value = "";
      document.getElementById('txt-name').innerText = "-";
      document.getElementById('txt-title').innerText = "-";
      document.getElementById('search-feedback').innerHTML = "";
      
      base64ImageStr = null;
      isUserVerified = false;
      stopCamera();
      
      document.getElementById('camera-section').style.display = "none";
      document.getElementById('preview-container').style.display = "none";
      document.getElementById('btn-open-camera').style.display = "block";
      document.getElementById('btn-open-camera').disabled = true;
      
      validateForm();
    }

    function showLoading(text) {
      document.getElementById('loading-text').innerText = text;
      document.getElementById('loading').classList.remove('d-none');
    }

    function hideLoading() { document.getElementById('loading').classList.add('d-none'); }
  </script>
</body>
</html>
